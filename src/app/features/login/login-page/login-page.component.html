<div class="container py-5" style="max-width: 520px">
  <h2 class="mb-2">Iniciar sesión</h2>
  <p class="text-muted mb-4">Ingresa tu correo para continuar.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" [attr.aria-busy]="loading">
    <div class="mb-3">
      <label for="email" class="form-label">Correo</label>
      <input
        id="email"
        type="email"
        class="form-control"
        formControlName="email"
        [disabled]="loading"
        autocomplete="email"
        inputmode="email"
        aria-describedby="emailHelp"
        [attr.aria-invalid]="
          form.controls.email.touched && form.controls.email.invalid
        "
        [class.is-invalid]="
          form.controls.email.touched && form.controls.email.invalid
        "
        placeholder="test@mail.com"
      />
      <small id="emailHelp" class="form-text text-muted">
        Solo necesitamos tu correo.
      </small>
      <div class="invalid-feedback">Ingresa un correo válido.</div>
    </div>

    <div
      *ngIf="errorMsg"
      class="alert alert-danger py-2"
      role="alert"
      aria-live="polite"
    >
      {{ errorMsg }}
    </div>

    <button
      class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2"
      type="submit"
      [disabled]="loading"
      aria-label="Continuar"
    >
      <span
        *ngIf="loading"
        class="spinner-border spinner-border-sm"
        role="status"
        aria-hidden="true"
      ></span>
      <span>{{ loading ? "Cargando..." : "Continuar" }}</span>
    </button>
  </form>
</div>
